name: 실시간 트렌드 브리핑 3시간마다 자동 갱신

on:
  schedule:
    - cron: '15 */3 * * *' # 3시간마다 자동 수집·빌드·배포 (0원·0토큰)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Commit updated trend archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet || git commit -m "Update live KR trend archive"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: IndexNow Auto-Ping
        continue-on-error: true
        run: |
          python3 -c "
          import json, urllib.request
          key = 'a91c64e2b8504f3da72e110c489b527e'
          payload = json.dumps({'host':'0520goeus.github.io','key':key,'keyLocation':'https://0520goeus.github.io/kr-trend-brief/'+key+'.txt','urlList':['https://0520goeus.github.io/kr-trend-brief/']}).encode()
          urllib.request.urlopen(urllib.request.Request('https://api.indexnow.org/indexnow', data=payload, headers={'Content-Type':'application/json'}), timeout=10)
          "
